<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Работа с DOM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Задание 1</h2>
  <p class="test-text"></p>

  <h2>Задание 2</h2>
  <form>
    <input type="email" id="email" placeholder="Email">
    <label><input type="checkbox" id="remember"> Запомнить меня</label>
    <button type="submit" id="btn">Отправить</button>
  </form>

  <h2>Задание 3</h2>
  <div id="link-box"></div>

  <h2>Задание 4</h2>
  <svg id="scene" width="130" height="390" viewBox="0 0 260 780" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="0" width="250" height="780" rx="20" fill="#fff9d6"/>
    <g id="balloon">
      <circle cx="130" cy="553" r="100" fill="#d11f41"/>
      <polygon points="130,650 120,662 140,662" fill="#d11f41"/>
      <polyline points="130,662 140,684 125,712 139,742 125,772 130,780"
                fill="none" stroke="#8b3a3a" stroke-width="1.5"/>
    </g>
  </svg>
  <br>
  <button id="start">Пуск</button>

  <script src="js/script.js"></script>
</body>
</html>
